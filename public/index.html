<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<title>Arachynana — Video Post</title>
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>

<div class="shell">

  <!-- ===== sidebar (desktop) ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div class="brand-text">
        <strong>Video Post</strong>
        <small>Arachynana</small>
      </div>
    </div>

    <nav class="nav" id="sideNav"></nav>

    <div class="sidebar-foot">
      <div class="usage" id="usageBox" hidden>
        <div class="usage-label">Kuota API Buffer hari ini</div>
        <div class="usage-track"><div class="usage-fill" id="usageFill"></div></div>
        <div class="usage-num" id="usageNum">—</div>
      </div>
    </div>
  </aside>

  <!-- ===== konten ===== -->
  <div class="main-wrap">
    <header class="topbar">
      <span class="brand-mark sm">A</span>
      <h1 id="pageTitle">Stok Video</h1>
      <!-- Pengaturan tidak ikut bottom-nav (tujuh tombol terlalu sempit di HP),
           jadi di layar kecil pintu masuknya di sini. -->
      <a class="icon-btn navlink settings-link" data-path="/pengaturan" href="#/pengaturan"
         title="Pengaturan" aria-label="Pengaturan">
        <svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>
        </svg>
      </a>
      <button class="icon-btn" id="reloadBtn" title="Muat ulang halaman ini" aria-label="Muat ulang">
        <svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button class="icon-btn" id="logoutBtn" title="Keluar" aria-label="Keluar">
        <svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
        </svg>
      </button>
    </header>

    <main class="main" id="view"></main>
  </div>

  <!-- ===== bottom nav (mobile) ===== -->
  <nav class="bottomnav" id="bottomNav"></nav>

</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
